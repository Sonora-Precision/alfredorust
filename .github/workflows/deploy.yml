name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    # Self-hosted runner on the 32-core "casa" box: persistent local target/ +
    # rustup cache → incremental Rust builds (~1 min vs ~3-8 on GitHub-hosted).
    # NOTE: casa must be online for deploys to run.
    runs-on: [self-hosted, casa]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff changed paths
          clean: false # keep target/ between runs (incremental builds on the persistent runner)

      # Frontend-only pushes (only solid/** changed) skip the Rust build + binary
      # swap + service restart: the Axum ServeDir serves /v3 straight from
      # solid/dist on disk, so replacing those files is live immediately. Backend
      # changes (or an unknown diff base) do the full build + restart.
      - name: Detect changed areas
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qvE '^solid/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.changes.outputs.backend == 'true'
        uses: dtolnay/rust-toolchain@stable

      # No actions/cache step: the self-hosted runner keeps ~/.cargo + target/ on
      # local disk between runs (see checkout clean:false), which is faster than
      # restoring a GitHub-hosted cache built with different absolute paths.

      - name: Build release
        if: steps.changes.outputs.backend == 'true'
        env:
          RUSTFLAGS: "-C target-cpu=x86-64"
        run: cargo build --release

      # --- SPA (SolidJS /v3) build — always ------------------------------
      - name: Setup Node (Vite)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Solid SPA (solid/dist)
        run: |
          cd solid
          npm ci
          npm run build

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND: ${{ steps.changes.outputs.backend }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null  # validate key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          RSYNC_E="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          if [ "$BACKEND" = "true" ]; then
            # Ship the binary to a temp name, then atomically swap it into place.
            # Overwriting the running executable in-place corrupts its mapped code
            # pages (→ SIGILL/core-dump); `mv` keeps the live process's inode
            # until the restart below picks up the new file.
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              target/release/alfredodev \
              $SSH_USER@$SSH_HOST:/home/$SSH_USER/alfredorust/alfredodev.new
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              target/release/sat_probe \
              $SSH_USER@$SSH_HOST:/home/$SSH_USER/alfredorust/sat_probe.new
            $SSH $SSH_USER@$SSH_HOST \
              "chmod +x /home/$SSH_USER/alfredorust/alfredodev.new /home/$SSH_USER/alfredorust/sat_probe.new && mv -f /home/$SSH_USER/alfredorust/alfredodev.new /home/$SSH_USER/alfredorust/alfredodev && mv -f /home/$SSH_USER/alfredorust/sat_probe.new /home/$SSH_USER/alfredorust/sat_probe"
          fi

          # Ship the SolidJS SPA build (/v3); --delete prunes stale hashed assets.
          # Served straight from disk by ServeDir, so no restart needed for this.
          $SSH $SSH_USER@$SSH_HOST \
            "mkdir -p /home/$SSH_USER/alfredorust/solid/dist"
          rsync -az --delete -e "$RSYNC_E" \
            solid/dist/ \
            $SSH_USER@$SSH_HOST:/home/$SSH_USER/alfredorust/solid/dist/

          # Ship the committed Playwright UI report (generated locally, not in CI)
          # so it's served at /test/reports/playwright on the test tenant.
          $SSH $SSH_USER@$SSH_HOST \
            "mkdir -p /home/$SSH_USER/alfredorust/test-reports/playwright"
          rsync -az --delete -e "$RSYNC_E" \
            test-reports/playwright/ \
            $SSH_USER@$SSH_HOST:/home/$SSH_USER/alfredorust/test-reports/playwright/

          if [ "$BACKEND" = "true" ]; then
            $SSH $SSH_USER@$SSH_HOST "sudo systemctl restart alfredorust"
          fi
